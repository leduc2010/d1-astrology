# Ask AI proxy. Deploy: npx wrangler deploy   (see README.md)
name = "ortus-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# Public address https://ortus-ai-proxy.<subdomain>.workers.dev; no per-version preview URLs.
workers_dev = true
preview_urls = false

[vars]
# Any OpenAI-compatible provider; change these to switch (see README.md). Default: Google Gemini.
# Use a billed Gemini key: on the free tier Google may use prompts to improve its products.
AI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
AI_MODEL = "gemini-3.1-flash-lite"
# Gemini 3 models cannot turn thinking off; "minimal" keeps it short. Remove for providers without reasoning_effort.
AI_REASONING_EFFORT = "minimal"

# Per-client burst limit (by IP). The app also keeps its own daily allowance.
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[observability]
enabled = true
